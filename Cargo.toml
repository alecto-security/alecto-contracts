[package]
name = "alecto-contracts"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
description = "Shared contract types for the Alecto evidence ecosystem: the Common Security Model, the evidence-bundle schema v1, and the notary record format"
repository = "https://github.com/alecto-security/alecto-contracts"
publish = true

[lib]
name = "alecto_contracts"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["serde", "macros", "parsing", "formatting"] }
uuid = { version = "1", features = ["v7", "serde"] }
sha2 = "0.10"
hex = "0.4"

[profile.release]
strip = true
